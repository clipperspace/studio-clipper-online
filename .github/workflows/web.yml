# Build tampilan website menjadi situs statis lalu terbitkan sebagai web.zip di rilis "web-latest".
# File ini diunduh oleh skrip instalasi Termux (termux/install.sh), sehingga HP tidak perlu Node.js.
name: Build web (statis)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build statis
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
        run: npx next build

      - name: Zip
        run: cd frontend/out && zip -qr "$GITHUB_WORKSPACE/web.zip" .

      - name: Terbitkan ke rilis web-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view web-latest >/dev/null 2>&1; then
            gh release create web-latest --latest=false \
              --title "Tampilan web (otomatis)" \
              --notes "Tampilan Studio Clipper versi statis untuk instalasi di HP Android (Termux). Diperbarui otomatis setiap ada perubahan di folder frontend."
          fi
          gh release upload web-latest web.zip --clobber
